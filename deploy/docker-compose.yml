# SickleGuard: one instance per Compose project. Run it with the sickleguard CLI (cli/), which passes
#   -p sg-<instance> --env-file deploy/<instance>.env  and IMAGE_TAG (the git SHA the images were built from).
# Only the web container publishes a port: ${WEB_BIND}:${WEB_PORT} (the edge proxy or an SSH tunnel reaches it).
# nginx in the web container serves the app and proxies /api/ -> sickleguard-api:8210 (unique name; see the api service). The MCP server stays internal.
# Volumes: db-data (Postgres), qdrant-data (vectors), app-data (/app/data: uploaded files); `sickleguard backup`
# saves all three. The risk model is baked into the api image (/app/models, trained at build), so every image tag
# carries its own model and a rollback brings the matching model back.
# On the Kasada server the CLI adds -f deploy/shared-edge.yml (web joins kasada-edge's network).
name: ${COMPOSE_PROJECT_NAME:-sg}

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  CHAT_MODEL: ${CHAT_MODEL:-gpt-4.1-mini}
  EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-small}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sg}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/<instance>.env}@db:5432/${POSTGRES_DB:-sickleguard}
  QDRANT_URL: http://qdrant:6333
  MCP_URL: http://mcp:8211/mcp
  MCP_HOST: 0.0.0.0
  MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in deploy/<instance>.env}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/<instance>.env}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sickleguard.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8310}
  SEED_DEMO: ${SEED_DEMO:-false}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-}
  SIMULATE_DEVICES: ${SIMULATE_DEVICES:-false}
  DATA_DIR: /app/data

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/<instance>.env}
      POSTGRES_DB: ${POSTGRES_DB:-sickleguard}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: { context: ../api }
    image: sg-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *app-env
    volumes: [app-data:/app/data]
    networks:
      default:
        # unique name for the web container's nginx: on a shared server the web container also sits on the
        # kasada-edge network, where other products have services called "api" too
        aliases: ["sickleguard-api"]
    depends_on:
      db: { condition: service_healthy }
      qdrant: { condition: service_healthy }

  mcp:
    image: sg-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_server"]
    environment: *app-env
    volumes: [app-data:/app/data]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8211), 3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build: { context: ../web }
    image: sg-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8310}:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  db-data:
  qdrant-data:
  app-data:
