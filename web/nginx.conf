server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    server_tokens off;

    # Docker's DNS: look the api container up again when it is recreated (deploy, rollback, restart), instead of
    # keeping the address it had when nginx started.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # "sickleguard-api", not "api": on the shared kasada-edge network "api" can be another product's container
    set $api_upstream http://sickleguard-api:8210;

    # API, including the assistant stream (Server-Sent Events): no buffering
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
