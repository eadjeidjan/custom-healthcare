[project]
name = "sickleguard-api"
version = "1.0.0"
description = "SickleGuard: vaso-occlusive crisis early warning for sickle cell disease (RAG, Qdrant, MCP, LangGraph, LangChain, OpenAI)"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "joblib>=1.4",
    "langchain>=1.4.9",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=1.30.0",
    "numpy>=2.1",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pypdf>=7.0.0",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.20.0",
    "scikit-learn>=1.6",
    "sqlalchemy[asyncio]>=2.1.8",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
